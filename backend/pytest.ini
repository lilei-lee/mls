[pytest]
# 只收集 tests/ 目录下的正式单测。
# 根目录下有一次性运维脚本(如 db_test.py)文件名碰巧匹配 *_test.py,
# 它们在 import 时就连 MongoDB 甚至写入种子数据 —— 绝不能被 pytest 当测试收集。
testpaths = tests

# 让 tests/ 内的 `from db_router import` / `from routers.xxx import` /
# `from services.listings import` 等按模块名导入稳定生效(backend/ 进 sys.path),
# 不再依赖各测试文件顶部硬编码的 sys.path.insert(Windows 绝对路径)。
pythonpath = .
