<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MLS 管理后台{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
           background: #f1f5f9; color: #0f172a; }
    header { background: #0f172a; color: #fff; padding: 12px 24px; display: flex;
             align-items: center; gap: 24px; }
    header .brand { font-weight: 700; font-size: 16px; }
    header nav { display: flex; gap: 18px; flex: 1; }
    header nav a { color: #cbd5e1; text-decoration: none; font-size: 14px; }
    header nav a:hover, header nav a.active { color: #fff; }
    header .logout { color: #fca5a5; text-decoration: none; font-size: 13px; }
    main { max-width: 1080px; margin: 24px auto; padding: 0 24px; }
    h1 { font-size: 20px; margin: 0 0 16px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px; }
    .card .label { font-size: 12px; color: #64748b; }
    .card .value { font-size: 26px; font-weight: 700; margin-top: 4px; }
    .card .sub { font-size: 12px; color: #94a3b8; margin-top: 6px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px;
            overflow: hidden; border: 1px solid #e2e8f0; }
    th, td { text-align: left; padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #f1f5f9; }
    th { background: #f8fafc; color: #475569; font-weight: 600; }
    .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; }
    .tag.ok { background: #dcfce7; color: #166534; }
    .tag.no { background: #fee2e2; color: #991b1b; }
    form.inline { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
                  padding: 16px; margin-bottom: 16px; display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
    label { font-size: 12px; color: #475569; display: block; margin-bottom: 4px; }
    input { padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
    button { padding: 9px 18px; background: #0f172a; color: #fff; border: 0; border-radius: 8px;
             font-size: 14px; cursor: pointer; }
    button:hover { background: #1e293b; }
    .msg { background: #ecfeff; border: 1px solid #a5f3fc; color: #155e75; padding: 10px 14px;
           border-radius: 8px; font-size: 13px; margin-bottom: 14px; }
    .err { background: #fee2e2; border: 1px solid #fecaca; color: #991b1b; padding: 10px 14px;
           border-radius: 8px; font-size: 13px; margin-bottom: 14px; }
  </style>
</head>
<body>
  {% block nav %}
  <header>
    <span class="brand">MLS 管理后台</span>
    <nav>
      <a href="/admin/">数据看板</a>
      <a href="/admin/agents">经纪人</a>
      <a href="/admin/listings">房源</a>
      <a href="/admin/audit">审计日志</a>
    </nav>
    <a class="logout" href="/admin/logout">退出登录</a>
  </header>
  {% endblock %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
