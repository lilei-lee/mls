{% extends "admin/base.html" %}
{% block title %}登录 · MLS 管理后台{% endblock %}
{% block nav %}{% endblock %}
{% block content %}
<div style="max-width: 340px; margin: 60px auto;">
  <h1 style="text-align:center;">MLS 管理后台</h1>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form method="post" action="/admin/login" style="background:#fff; border:1px solid #e2e8f0; border-radius:10px; padding:22px;">
    <div style="margin-bottom:14px;">
      <label>账号</label>
      <input name="username" style="width:100%;" autofocus required>
    </div>
    <div style="margin-bottom:18px;">
      <label>密码</label>
      <input name="password" type="password" style="width:100%;" required>
    </div>
    <button type="submit" style="width:100%;">登录</button>
  </form>
</div>
{% endblock %}
